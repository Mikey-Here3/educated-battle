<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff003c" />
      <stop offset="50%" stop-color="#ff2a55" />
      <stop offset="100%" stop-color="#990024" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Badge Background -->
  <g transform="translate(8, 5)">
    <!-- Outer Glow Shield -->
    <path d="M40 0 L75 14 L75 48 C75 66 58 76 40 82 C22 76 5 66 5 48 L5 14 Z" 
          fill="#0c060a" stroke="url(#crimsonGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner Shield Inset -->
    <path d="M40 8 L67 19 L67 46 C67 60 53 68 40 73 C27 68 13 60 13 46 L13 19 Z" 
          fill="#160b13" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.9"/>
    
    <!-- EG Monogram -->
    <path d="M26 30 L54 30 L54 36 L34 36 L34 42 L50 42 L50 48 L34 48 L34 56 L54 56 L54 62 L26 62 Z" fill="url(#crimsonGrad)"/>
    <path d="M42 42 L56 42 L56 58 L42 58 L42 52 L50 52 L50 48 L42 48 Z" fill="url(#goldGrad)"/>

    <!-- Small Golden Star on Top -->
    <polygon points="40,14 42.5,20 49,20.5 44,24.5 45.5,31 40,27.5 34.5,31 36,24.5 31,20.5 37.5,20" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(96, 20)">
    <!-- EDUCATED -->
    <text x="0" y="24" font-family="'Outfit', 'Impact', sans-serif" font-size="26" font-weight="900" letter-spacing="2.5" fill="#ffffff">
      EDUCATED
    </text>
    
    <!-- GAMER with Crimson Gradient & Glow -->
    <text x="165" y="24" font-family="'Outfit', 'Impact', sans-serif" font-size="26" font-weight="900" letter-spacing="2.5" fill="url(#crimsonGrad)" filter="url(#glow)">
      GAMER
    </text>

    <!-- Subtitle: ESPORTS ARENA -->
    <g transform="translate(0, 42)">
      <rect x="0" y="-12" width="75" height="16" rx="4" fill="url(#crimsonGrad)" opacity="0.2" />
      <rect x="0" y="-12" width="75" height="16" rx="4" stroke="url(#crimsonGrad)" stroke-width="1" fill="none" />
      <text x="8" y="0" font-family="'Inter', sans-serif" font-size="9" font-weight="900" letter-spacing="2" fill="#ffd700">
        ESPORTS
      </text>

      <text x="85" y="0" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="4" fill="#94a3b8">
        ARENA ? PK
      </text>
    </g>
  </g>
</svg>
